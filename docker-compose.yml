services:



  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
    networks:
      - secure_api_bank

  postgres:
    container_name: postgres
    image: postgres:17
    environment:
      POSTGRES_DB: db_name
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USER}
    ports:
      - "5432:5432"
    networks:
      - secure_api_bank
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: ./
    container_name: secure_api
    ports:
      - "3000:8080"
    environment:
      DB_HOST: postgres
      RABBITMQ_HOST: rabbitmq
      DB_URL: ${DB_URL}
      SPRING_PROFILES_ACTIVE: docker
    env_file:
      - SecureBankingApi/.env
    networks:
      - secure_api_bank
    depends_on:
        - rabbitmq
        - postgres



networks:
  secure_api_bank:
    driver: bridge